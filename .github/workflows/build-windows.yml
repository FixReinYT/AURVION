name: AURVION Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "jarvis/**"
      - "assets/**"
      - "installer/**"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Validate project files
        shell: pwsh
        run: |
          $required = @("main.py", "requirements.txt", "jarvis/ui/main_window.py", "assets/AURVION.ico", "assets/AURVION.svg", "assets/AURVION.jpeg", "installer/AURVION_Setup.iss")
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            Write-Error ("Missing required project files: " + ($missing -join ", "))
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download offline Russian speech model
        shell: pwsh
        run: |
          $modelName = "vosk-model-small-ru-0.22"
          New-Item -ItemType Directory -Force models | Out-Null
          Invoke-WebRequest "https://alphacephei.com/vosk/models/$modelName.zip" -OutFile "models/$modelName.zip"
          Expand-Archive "models/$modelName.zip" "models" -Force
          Remove-Item "models/$modelName.zip" -Force

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build AURVION application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name AURVION --icon "assets/AURVION.ico" --collect-all vosk --collect-all sounddevice --collect-all pyttsx3 --collect-all PySide6 --hidden-import win32com.client --hidden-import comtypes --add-data "assets;assets" --add-data "models;models" main.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found." }
          & $iscc "installer/AURVION_Setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURVION-Setup-Windows-x64
          path: installer/Output/AURVION_Setup_*.exe
          if-no-files-found: error
          retention-days: 30
